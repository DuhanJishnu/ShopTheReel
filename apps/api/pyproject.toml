[project]
name = "shopthereel-api"
version = "0.1.0"
description = "ShopTheReel API (Phase 1 foundations)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "boto3>=1.34",
  "redis>=5.0",
  "structlog>=24.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "email-validator>=2.0",
  "arq>=0.26",
  "google-genai>=1.0",
  "scenedetect>=0.6",
  "opencv-python-headless>=4.8",
  "Pillow>=10.0",
  "ImageHash>=4.3",
  "pgvector>=0.5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "aiosqlite>=0.19",
  "ruff>=0.4",
  "mypy>=1.10",
  "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = []
