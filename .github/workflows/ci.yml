name: ci
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shopthereel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cd apps/api && uv sync --group dev
      - run: cd apps/api && uv run ruff check .
      - run: cd apps/api && uv run mypy app
      - run: cd apps/api && uv run pytest -q
        env:
          APP_ENV: test
          DATABASE_URL_TEST: postgresql+asyncpg://shop:shop@localhost:5432/shopthereel
          REDIS_URL: redis://localhost:6379/0
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd apps/mobile && npm ci && npm run lint && npm run typecheck
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./apps/api
